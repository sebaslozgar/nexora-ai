<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEXORA AI | Demo</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#e8edf6;background:#0b1220}*{box-sizing:border-box}body{margin:0}header{padding:20px;background:#111d31;border-bottom:1px solid #2d3b51}h1{margin:0;font-size:25px}small,.muted{color:#9eacc0}main{max-width:800px;margin:auto;padding:18px}.tabs{display:flex;gap:10px;margin-bottom:16px}button{cursor:pointer;border:0;border-radius:10px;padding:12px 16px;font-weight:700;background:#39b88a;color:#071b17}.tabs button{flex:1;background:#26354c;color:#fff}.tabs button.active{background:#39b88a;color:#071b17}.panel{background:#142136;border:1px solid #2b3b53;border-radius:16px;padding:16px}.messages{height:360px;overflow:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}.bubble{max-width:90%;padding:12px;border-radius:14px;background:#263750;white-space:pre-wrap}.mine{align-self:flex-end;background:#185c4f}.send{display:flex;gap:8px}input{min-width:0;flex:1;border-radius:10px;border:1px solid #40536e;background:#0c1627;color:#fff;padding:12px;font-size:16px}.lead{background:#1d2e45;border-radius:12px;padding:14px;margin:12px 0} .lead p{margin:6px 0}.tag{color:#76e3b8;font-weight:bold} .hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px} .secondary{background:#34465f;color:#fff}footer{padding:20px;text-align:center;font-size:12px;color:#8d9bb0}
</style></head><body><header><h1>✦ NEXORA AI</h1><small>Asistente comercial · Demostración 0.2</small></header><main><div class="tabs"><button id="chatTab" class="active" onclick="tab('chat')">💬 Chat</button><button id="leadsTab" onclick="tab('leads')">📋 Clientes <span id="count">0</span></button></div><section id="chat" class="panel"><div class="messages" id="messages" aria-live="polite"></div><form id="form" class="send"><input id="reply" placeholder="Escribe tu respuesta..." autocomplete="off" required aria-label="Tu respuesta"><button>Enviar</button></form><div class="actions"><button class="secondary" onclick="restart()">Nueva conversación</button></div></section><section id="leads" class="panel hidden"><h2>Fichas de clientes</h2><p class="muted">Solo datos de prueba guardados en este navegador. No se envían a un servidor.</p><div id="leadList"></div><button class="secondary" onclick="clearLeads()">Borrar fichas de prueba</button></section></main><footer>Demo guiada por reglas · No conectada a WhatsApp ni a una IA externa · No introduzcas datos personales reales.</footer><script>
const prompts=["¡Hola! 👋 Soy el asistente de demostración de NEXORA AI. ¿Qué marca, modelo y año tiene el coche que quieres revisar?","¿En qué ciudad se encuentra el coche?","¿Cuándo tienes pensado comprarlo? (Por ejemplo: mañana, esta semana o solo estoy mirando)","¿Qué necesitas: una revisión completa, revisar un problema concreto o solo información?","¿El vendedor te permite revisar el coche con un profesional antes de comprarlo? (Sí, no o todavía no lo sé)"];
let step=0,answers=[];const $=id=>document.getElementById(id);const storageKey='nexora_demo_leads_v02';function getLeads(){try{return JSON.parse(localStorage.getItem(storageKey)||'[]')}catch{return []}}function saveLeads(v){try{localStorage.setItem(storageKey,JSON.stringify(v))}catch{alert('No se ha podido guardar en este navegador.')}}function bubble(text,mine=false){let el=document.createElement('div');el.className='bubble'+(mine?' mine':'');el.textContent=text;$('messages').append(el);$('messages').scrollTop=$('messages').scrollHeight}function restart(){step=0;answers=[];$('messages').replaceChildren();$('reply').disabled=false;$('form').querySelector('button').disabled=false;$('reply').value='';bubble(prompts[0]);tab('chat')}
function classify(a){let t=a[2].toLowerCase(),n=a[3].toLowerCase();let soon=/mañana|pasado mañana|esta semana|hoy|\b[1-7] días\b/.test(t);let browsing=/mirando|curios|sin fecha|no sé|no se|todavía no|aún no/.test(t);let review=/completa|revis|problema|motor|freno/.test(n);return soon&&review?'Prioritario':browsing?'Explorando':'Por valorar'}
$('form').addEventListener('submit',e=>{e.preventDefault();if(step>=5)return;let value=$('reply').value.trim();if(!value)return;answers.push(value);bubble(value,true);$('reply').value='';step++;if(step<5){bubble(prompts[step]);return}let status=classify(answers),lead={vehiculo:answers[0],ciudad:answers[1],fecha:answers[2],necesidad:answers[3],permiso:answers[4],status,created:new Date().toLocaleString('es-ES')};let leads=getLeads();leads.unshift(lead);saveLeads(leads);bubble('¡Gracias! He preparado una ficha de demostración para el responsable. El precio y la disponibilidad quedan pendientes de confirmación. No se ha realizado ninguna reserva.');bubble('Clasificación interna: '+status+'. Puedes consultar la ficha en la pestaña Clientes.');$('reply').disabled=true;$('form').querySelector('button').disabled=true;renderLeads()});function tab(name){$('chat').classList.toggle('hidden',name!=='chat');$('leads').classList.toggle('hidden',name!=='leads');$('chatTab').classList.toggle('active',name==='chat');$('leadsTab').classList.toggle('active',name==='leads');if(name==='leads')renderLeads()}
function renderLeads(){let leads=getLeads();$('count').textContent=leads.length;let box=$('leadList');box.replaceChildren();if(!leads.length){let p=document.createElement('p');p.textContent='Todavía no hay fichas. Completa una conversación de prueba.';box.append(p)}leads.forEach((l,i)=>{let card=document.createElement('div');card.className='lead';let title=document.createElement('strong');title.textContent='Cliente de prueba '+(leads.length-i);card.append(title);for(let [key,val] of [['Vehículo',l.vehiculo],['Ciudad',l.ciudad],['Compra',l.fecha],['Necesidad',l.necesidad],['Permiso',l.permiso],['Prioridad',l.status],['Fecha de ficha',l.created]]){let p=document.createElement('p');p.textContent=key+': '+val;card.append(p)}let btn=document.createElement('button');btn.textContent='Copiar ficha';btn.onclick=async()=>{let txt=`NEXORA AI - FICHA DEMO\nVehículo: ${l.vehiculo}\nCiudad: ${l.ciudad}\nCompra: ${l.fecha}\nNecesidad: ${l.necesidad}\nPermiso: ${l.permiso}\nPrioridad: ${l.status}\nPrecio y disponibilidad pendientes. Sin reserva.`;try{await navigator.clipboard.writeText(txt);btn.textContent='Copiada ✓'}catch{alert('No se pudo copiar automáticamente en este navegador.')}};card.append(btn);box.append(card)})}function clearLeads(){if(confirm('¿Borrar todas las fichas de prueba de este navegador?')){saveLeads([]);renderLeads()}}restart();renderLeads();
</script></body></html>
